<style>
  :root {
    --bg: #f4f2fb; --card: #ffffff; --text: #1f1b2e; --muted: #6b6780;
    --line: #e3dff0; --accent: #6c4cf1; --accent-soft: #ece7ff;
    --ok: #1a9c5b; --ok-soft: #dcf5e7; --bad: #d63a4a; --bad-soft: #fde3e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15131f; --card: #211e30; --text: #f1eefb; --muted: #a29dba;
      --line: #35304a; --accent: #9c85ff; --accent-soft: #2e2850;
      --ok: #4fd08f; --ok-soft: #173a2a; --bad: #ff7a88; --bad-soft: #45202a;
    }
  }
  * { box-sizing: border-box; }
  button, input, label { touch-action: manipulation; }
  button { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; padding-bottom: calc(48px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) {
    body { font-size: 20px; }
    #app { max-width: 680px; padding-top: 36px; }
  }
  h1 { font-size: 1.6rem; margin: 4px 0 2px; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; margin: 14px 0;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    display: block; width: 100%; padding: 14px 16px; border-radius: 14px;
    border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 1.05rem;
  }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .chip {
    padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--card); font-size: .9rem;
  }
  .chip small { opacity: .7; font-weight: 500; margin-left: 2px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

  .mode {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 16px; margin: 10px 0;
  }
  .mode .ico { font-size: 1.8rem; width: 40px; text-align: center; }
  .mode b { display: block; }
  .mode span.muted { display: block; }
  .section { margin: 22px 0 4px; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label.check { display: flex; align-items: center; gap: 8px; font-size: .95rem; margin-top: 8px; }
  label.check input { width: 20px; height: 20px; accent-color: var(--accent); }

  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .top .bar { flex: 1; }
  .x { border: 0; background: none; font-size: 1.4rem; padding: 4px 8px; color: var(--muted); }
  .count { font-size: .9rem; color: var(--muted); min-width: 48px; text-align: right; }

  .q { text-align: center; padding: 26px 18px; }
  .q .head { font-size: 1.7rem; font-weight: 800; line-height: 1.25; }
  .q .head.sentence { font-size: 1.3rem; font-weight: 600; }
  .q .sub { color: var(--muted); margin-top: 6px; }
  .say { border: 0; background: var(--accent-soft); border-radius: 99px; padding: 4px 10px; margin-left: 6px; font-size: 1rem; vertical-align: middle; }
  .say.big { font-size: 1.3rem; font-weight: 700; padding: 14px 28px; margin: 0; color: var(--accent); }
  .blank { display: inline-block; min-width: 64px; border-bottom: 3px solid var(--accent); color: var(--accent); font-weight: 800; padding: 0 4px; }
  .hint { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 2px 10px; font-weight: 700; }

  .field { margin: 12px 0; }
  .field label { display: block; font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  input[type=text] {
    width: 100%; padding: 14px; font: inherit; font-size: 1.15rem; color: var(--text);

  input.bad { border-color: var(--bad); background: var(--bad-soft); }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .opt { padding: 16px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 1.05rem; }
  .opt.ok { border-color: var(--ok); background: var(--ok-soft); }
  .opt.bad { border-color: var(--bad); background: var(--bad-soft); }

  .fb { border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-weight: 600; }
  .fb.ok { background: var(--ok-soft); color: var(--ok); }
  .fb.bad { background: var(--bad-soft); color: var(--bad); }

  .forms div { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; }
  .forms span { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .forms b { font-size: 1.2rem; }

  .score { font-size: 3rem; font-weight: 800; text-align: center; margin: 6px 0 0; }
  .center { text-align: center; }
  ul.miss { padding-left: 20px; margin: 6px 0 0; }
  ul.miss li { margin: 4px 0; }

  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 4px; position: sticky; top: 0; background: var(--bg); }
  td { padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: top; }

  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: .85rem; padding: 8px; }
</style>

<script>
// ---------- Daten: List of irregular verbs (S. 215–217) ----------

const VERBS = [

const RANGES = [

// to be im Simple Past: [Satz, Lösung]
const WAS_WERE = [

  ["We ___ at the cinema last night.", "were"],
  ["My sister ___ ill last week.", "was"],
  ["The children ___ very tired after the trip.", "were"],

  ["The film ___ really funny.", "was"],
  ["He ___ (not) at school yesterday.", "wasn't"],
  ["They ___ (not) happy about the test.", "weren't"],
  ["___ you at the party on Saturday?", "were"],
  ["___ the test difficult?", "was"],
  ["Where ___ you last weekend?", "were"],
  ["My grandparents ___ (not) at home.", "weren't"],
  ["The weather ___ (not) very good.", "wasn't"],
  ["I ___ eleven last year.", "was"],
  ["___ your friends at the match?", "were"],

  ["My dog ___ (not) in the garden.", "wasn't"],

// Sätze im Simple Past: [Satz, Hinweis, Lösung]
const SENTENCES = [
  ["Last summer we ___ to Spain.", "go", "went"],
  ["I ___ a pizza for dinner yesterday.", "eat", "ate"],
  ["We ___ a great film last night.", "see", "saw"],
  ["My mum ___ a new car last week.", "buy", "bought"],

  ["I fell and ___ my arm.", "hurt", "hurt"],
  ["He ___ the old photos in a box.", "keep", "kept"],
  ["We ___ a lot of new words last week.", "learn", "learnt/learned"],
  ["My parents ___ me stay up late on Saturday.", "let", "let"],
  ["Sorry, I ___ Tuesday, not Thursday.", "mean", "meant"],
  ["Dad ___ for the ice cream.", "pay", "paid"],
  ["I ___ my keys on the table.", "put", "put"],
  ["She ___ her horse on the beach.", "ride", "rode"],
  ["He ___ goodbye and went home.", "say", "said"],
  ["I ___ my grandma a postcard from Spain.", "send", "sent"],
  ["The dog ___ the water off its coat.", "shake", "shook"],

  ["I ___ at seven o'clock this morning.", "wake up", "woke up"],

  ["She ___ her lunch.", "not / eat", "didn't eat/did not eat"],
  ["We ___ the film.", "not / see", "didn't see/did not see"],
  ["They ___ to the party.", "not / come", "didn't come/did not come"],
  ["He ___ his homework.", "not / do", "didn't do/did not do"],
  ["___ the tickets yesterday?", "you / buy", "did you buy"],

// Dateinamen der Audios – wird auch von tools/gen-audio.js benutzt
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const plain = (sentence, answer) => {
  let word = answer.split("/")[0];
  if (sentence.startsWith("___")) word = word[0].toUpperCase() + word.slice(1);
  return sentence.replace(" (not)", "").replace("___", word);
};

const VERSION = 11;
const SESSION_LEN = 10;
const KEY = "irregular-verbs-v1";

// ---------- Speicher ----------
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
store.p = store.p || {};          // Verb -> richtige Antworten in Folge
store.range = store.range || 0;
store.pp = !!store.pp;
if (store.sound === undefined) store.sound = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

// ---------- Helfer ----------
const app = document.getElementById("app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const disp = form => form.split("/").join(", ");
const streak = v => store.p[v[0]] || 0;
const isDone = v => streak(v) >= 2;
const pool = () => VERBS.slice(RANGES[store.range][1], RANGES[store.range][2]);

function norm(s) {
  return s.toLowerCase().replace(/[’`´]/g, "'").replace(/[().!?]/g, "").replace(/\s+/g, " ").trim();
}
function expand(form) {
  return form.split("/").flatMap(a => a.includes("(") ? [norm(a), norm(a.replace(/\(.*?\)/g, ""))] : [norm(a)]);
}
// needAll: alle Alternativen müssen genannt werden (was UND were)
function check(input, form, needAll) {
  const alts = expand(form), n = norm(input).replace(/^to /, "");
  if (!n) return false;
  if (!needAll && alts.includes(n)) return true;
  const parts = n.split(/[,\/]|\s+/).filter(p => p && !["and", "or", "und", "oder"].includes(p));
  return parts.length > 0 && parts.every(p => alts.includes(p)) && (!needAll || alts.every(a => parts.includes(a)));
}

// Spielt die MP3 ab; falls das nicht klappt, liest die Browser-Stimme vor
const player = new Audio();
function play(file, text) {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  player.onerror = () => speak(text);
  player.src = `audio/${file}.mp3`;
  const p = player.play();
  if (p) p.catch(() => {});
}
function speak(text) {
  if (!text || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text.replace(/[()\/]/g, " "));
  u.lang = "en-GB"; u.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const vAudio = (v, i) => `v/${slug(v[0])}-${i}`;
const sayBtn = (file, text) => `<button type="button" class="say" data-audio="${file}" data-say="${text}" aria-label="Anhören">🔊</button>`;
const fill = (sentence, word) => {
  if (sentence.startsWith("___")) word = word[0].toUpperCase() + word.slice(1);
  return sentence.replace(/ \(not\)/, "").replace("___", `<span class="blank">${word || "&nbsp;"}</span>`);
};

app.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) { e.stopPropagation(); play(b.dataset.audio, b.dataset.say); }
});

// ---------- Startseite ----------
function home() {
  const done = VERBS.filter(isDone).length;
  const modes = [

    ["write", "✍️", "Formen schreiben", "Du tippst die Formen selbst ein"],

    ["quiz", "🎯", "Quiz", "Vier Antworten – welche stimmt?"],
    ["listen", "🎧", "Hören & schreiben", "Du hörst die Simple-Past-Form und schreibst sie"]
  ];
  const grammar = [
    ["waswere", "🔀", "was oder were?", "to be im Simple Past"],
    ["sentences", "📝", "Sätze im Simple Past", "Lücken füllen, auch Verneinung und Fragen"]
  ];
  const btn = m => `<button class="mode" data-mode="${m[0]}"><span class="ico">${m[1]}</span><span><b>${m[2]}</b><span class="muted">${m[3]}</span></span></button>`;
  app.innerHTML = `
    <h1>🦝 Englisch-Trainer</h1>
    <p class="muted">Irregular verbs &amp; Simple Past</p>
    <div class="card">
      <h2>${done} von ${VERBS.length} Verben sicher</h2>
      <div class="bar"><i style="width:${done / VERBS.length * 100}%"></i></div>
      <p class="muted" style="margin:8px 0 0">Ein Verb gilt als sicher, wenn du es zweimal hintereinander richtig hattest.</p>
    </div>
    <div class="section">Welche Verben?</div>
    <div class="chips">${RANGES.map((r, i) => `<button class="chip ${i === store.range ? "on" : ""}" data-range="${i}">${r[0]} <small>${VERBS.slice(r[1], r[2]).filter(isDone).length}/${r[2] - r[1]}</small></button>`).join("")}</div>
    <div class="section">Unregelmäßige Verben</div>
    ${modes.map(btn).join("")}
    <div class="section">Grammatik</div>
    ${grammar.map(btn).join("")}
    <div class="section">Alles gemischt</div>
    ${btn(["exam", "🏁", "Probe-Arbeit", "to be, Verbformen und Sätze in einer Runde"])}
    <div class="section">Nachschlagen</div>
    <button class="mode" data-mode="list"><span class="ico">📖</span><span><b>Alle Verben</b><span class="muted">Die ganze Liste zum Nachlesen</span></span></button>
    <div class="section">Einstellungen</div>
    <label class="check"><input type="checkbox" id="pp" ${store.pp ? "checked" : ""}> Beim Schreiben auch die 3. Form (past participle) abfragen</label>
    <label class="check"><input type="checkbox" id="sound" ${store.sound ? "checked" : ""}> Lösung nach jeder Antwort vorlesen 🔊</label>
    <p class="center" style="margin-top:20px"><button class="link" id="reset">Fortschritt zurücksetzen</button></p>
    <p class="center muted">Version ${VERSION} · <button class="link" id="reload">🔄 Neu laden</button></p>`;
  store.session = null; save();

  app.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { store.range = +b.dataset.range; save(); home(); });
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => b.dataset.mode === "list" ? list() : start(b.dataset.mode));
  document.getElementById("pp").onchange = e => { store.pp = e.target.checked; save(); };
  document.getElementById("sound").onchange = e => { store.sound = e.target.checked; save(); };
  document.getElementById("reload").onclick = () => location.reload();
  document.getElementById("reset").onclick = () => { if (confirm("Wirklich den ganzen Fortschritt löschen?")) { store.p = {}; save(); home(); } };
  window.scrollTo(0, 0);
}

// ---------- Liste ----------
function list() {
  app.innerHTML = `
    <div class="top"><button class="x" id="back" aria-label="Zurück">←</button><h2 style="margin:0">Alle Verben</h2></div>
    <p class="muted">Tippe auf ein Wort, um es zu hören 🔊 – oder auf die Übersetzung für alle drei Formen.</p>
    <table>
      <tr><th>infinitive</th><th>simple past</th><th>past participle</th><th>German</th></tr>
      ${VERBS.map(v => `<tr class="${isDone(v) ? "done" : ""}" data-audio="${vAudio(v, "all")}" data-say="${verbAudio(v).sayText}">${[0, 1, 2].map(i => `<td data-audio="${vAudio(v, i)}" data-say="${v[i]}">${disp(v[i])}</td>`).join("")}<td class="de">${v[3]}</td></tr>`).join("")}
    </table>`;
  document.getElementById("back").onclick = home;
  window.scrollTo(0, 0);
}

// ---------- Fragen bauen ----------
// Zuerst die zuletzt falsch beantworteten Verben, dann die neuen, dann die schon gekonnten; bei Gleichstand zufällig
const rank = v => store.p[v[0]] === 0 ? -1 : streak(v);
const pickVerbs = () => shuffle(pool()).sort((a, b) => rank(a) - rank(b)).slice(0, SESSION_LEN);
const solution = v => `${v[0]} – ${disp(v[1])} – ${disp(v[2])}`;
const verbAudio = v => ({ audio: vAudio(v, "all"), sayText: `${v[0]}, ${v[1]}, ${v[2]}` });
const sentenceAudio = (s, answer) => ({ audio: "s/" + slug(plain(s, answer)), sayText: plain(s, answer) });

// Eselsbrücken: Verben, die sich gleich verhalten
const PATTERNS = [
  [v => v[0] === v[1] && v[1] === v[2], "Alle drei Formen werden gleich geschrieben"],
  [v => /ought$/.test(v[1]), "2. und 3. Form enden auf -ought"],
  [v => v[0].includes("i") && v[1] === v[0].replace("i", "a") && v[2] === v[0].replace("i", "u"), "Aus i wird a und dann u"],
  [v => /ew$/.test(v[1]) && /wn$/.test(v[2]), "2. Form mit -ew, 3. Form mit -wn"],
  [v => v[2] === v[0], "Die 3. Form ist wie die Grundform"],
  [v => v[1] === v[2], "2. und 3. Form sind gleich"]
];
function verbTip(v) {
  if (v[0] === "read") return "Merke: Alle drei Formen werden gleich geschrieben – aber die 2. und 3. Form spricht man wie <b>red</b>.";
  const i = PATTERNS.findIndex(p => p[0](v));
  if (i < 0) return "";
  const like = i === PATTERNS.length - 1 ? [] : VERBS.filter(o => o !== v && PATTERNS.findIndex(p => p[0](o)) === i).slice(0, 3);
  return `Merke: ${PATTERNS[i][1]}${like.length ? " – wie bei <b>" + like.map(o => o[0]).join(", ") + "</b>" : ""}.`;
}

// Erklärt typische Verwechslungen, damit klar wird, was schiefging
function mistake(val, f, v) {
  if (!v || !f.kind) return "";
  if (f.kind === "inf") {
    const o = VERBS.find(o => o[0] !== v[0] && check(val, o[0]));
    return o ? `„${o[0]}“ heißt ${o[3]}.` : "";
  }
  if (f.kind === "past") {
    if (v[1] !== v[2] && check(val, v[2])) return "Das ist die 3. Form.";
    if (v[1] !== v[0] && check(val, v[0])) return "Das ist die Grundform.";
    if (norm(val) === fakeRegular(v)) return "Dieses Verb ist unregelmäßig – ohne -ed!";
  }
  if (f.kind === "pp" && v[1] !== v[2] && check(val, v[1])) return "Das ist die 2. Form.";
  return "";
}

function fakeRegular(v) {
  const words = v[0].replace(/ \(.*\)/, "").split(" ");
  words[0] += words[0].length > 2 && words[0].endsWith("e") ? "d" : "ed";
  return words.join(" ");
}

function quizQuestion(v) {
  if (Math.random() < 0.6) {
    const opts = new Set([disp(v[1])]), fake = fakeRegular(v);
    if (!expand(v[1]).includes(fake)) opts.add(fake);   // "learned" wäre ja richtig
    if (v[2] !== v[1]) opts.add(disp(v[2]));
    for (const o of shuffle(VERBS)) { if (opts.size >= 4) break; opts.add(disp(o[1])); }
    return { type: "choice", verb: v, ...verbAudio(v), tip: verbTip(v), head: v[0], say: v[0], sub: `${v[3]}<br>Wie heißt das <b>Simple Past</b>?`, options: shuffle([...opts]), answer: disp(v[1]), solution: solution(v) };
  }
  const tokens = v[3].split("; ");
  const others = shuffle(VERBS).filter(o => o !== v && !o[3].split("; ").some(t => tokens.includes(t))).slice(0, 3);
  return { type: "choice", verb: v, audio: vAudio(v, 0), sayText: v[0], head: v[3], sub: "Wie heißt das auf Englisch?", options: shuffle([v, ...others].map(o => o[0])), answer: v[0], solution: `${v[3]} = ${v[0]}` };
}

function build(mode) {
  if (mode === "cards") return pickVerbs().map(v => ({ type: "card", tip: verbTip(v), verb: v, ...verbAudio(v), head: v[0], say: v[0], sub: v[3], solution: solution(v) }));
  if (mode === "quiz") return pickVerbs().map(quizQuestion);
  if (mode === "write") return pickVerbs().map(v => ({
    type: "input", tip: verbTip(v), verb: v, ...verbAudio(v), head: v[0], say: v[0], sub: v[3], solution: solution(v),
    fields: [{ kind: "past", label: "Simple Past (2. Form)", answer: v[1], needAll: v[0] === "be" }]
      .concat(store.pp ? [{ kind: "pp", label: "Past Participle (3. Form)", answer: v[2] }] : [])
  }));
  if (mode === "exam") {
    const sent = shuffle(SENTENCES), special = s => s[1].includes("/");   // immer auch eine Verneinung oder Frage
    return [...build("waswere").slice(0, 3), ...build("vocab").slice(0, 5), ...[...sent.filter(s => !special(s)).slice(0, 3), sent.find(special)].map(sentenceQ)];
  }
  if (mode === "vocab") return pickVerbs().map(v => ({
    type: "input", tip: verbTip(v), sentence: true, verb: v, ...verbAudio(v), head: v[3], sub: "Wie heißt das Verb auf Englisch?", solution: solution(v),
    fields: [{ kind: "inf", label: "Infinitive (1. Form)", answer: v[0] }, { kind: "past", label: "Simple Past (2. Form)", answer: v[1], needAll: v[0] === "be" }]
      .concat(store.pp ? [{ kind: "pp", label: "Past Participle (3. Form)", answer: v[2] }] : [])
  }));
  if (mode === "listen") return pickVerbs().map(v => ({
    type: "input", tip: verbTip(v), listen: true, verb: v, ...verbAudio(v), sub: v[3], solution: solution(v),
    head: `<button type="button" class="say big" data-audio="${vAudio(v, 1)}" data-say="${v[1]}">🔊 Anhören</button>`,
    fields: [{ kind: "past", label: "Welche Simple-Past-Form hörst du?", answer: v[1], needAll: v[0] === "be" }]
  }));
  if (mode === "waswere") return shuffle(WAS_WERE).slice(0, SESSION_LEN).map(s => ({
    type: "choice", sentence: true, ...sentenceAudio(s[0], s[1]), head: s[0].replace("___", '<span class="blank">&nbsp;</span>'),
    sub: "Was passt in die Lücke?", options: ["was", "were", "wasn't", "weren't"], answer: s[1], solution: fill(s[0], s[1])
  }));
  return shuffle(SENTENCES).slice(0, SESSION_LEN).map(sentenceQ);
}

function sentenceQ(s) {
  return {
    type: "input", sentence: true, ...sentenceAudio(s[0], s[2]), head: s[0].replace("___", '<span class="blank">&nbsp;</span>'),
    sub: `<span class="hint">(${s[1]})</span>`, fields: [{ label: "Was gehört in die Lücke?", answer: s[2] }],
    solution: fill(s[0], s[2].split("/")[0]),
    tip: s[1].includes("/") ? "Merke: Bei Verneinung und Fragen steht <b>did / didn't + Grundform</b>." : ""
  };
}

// ---------- Übungsrunde ----------
let S;
function start(mode) {
  S = { mode, qs: build(mode), i: 0, right: 0, wrong: [] };
  S.total = S.qs.length;
  showQ();
}

function showQ() {
  const q = S.qs[S.i];
  store.session = S; save();   // nach einem Neuladen geht es an derselben Stelle weiter
  let body = "";
  if (q.type === "input") {
    body = `<form id="f" autocomplete="off">
      ${q.fields.map((f, i) => `<div class="field"><label for="in${i}">${f.label}</label>
        <input type="text" id="in${i}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${i < q.fields.length - 1 ? "next" : "done"}"></div>`).join("")}
      <button class="btn" id="go">Prüfen</button></form>`;
  } else if (q.type === "choice") {
    body = `<div class="opts">${q.options.map(o => `<button class="opt">${o}</button>`).join("")}</div>`;
  } else {
    body = `<button class="btn" id="flip">Aufdecken</button>`;
  }
  app.innerHTML = `
    <div class="top">
      <button class="x" id="quit" aria-label="Beenden">✕</button>
      <div class="bar"><i style="width:${S.i / S.qs.length * 100}%"></i></div>
      <span class="count">${S.i + 1} / ${S.qs.length}</span>
    </div>
    <div class="card q">
      ${q.retry ? '<div class="hint" style="margin-bottom:12px">🔁 Nochmal</div>' : ""}
      <div class="head ${q.sentence ? "sentence" : ""}">${q.head}${q.say ? sayBtn(vAudio(q.verb, 0), q.say) : ""}</div>
      <div class="sub">${q.sub}</div>
      <div id="extra"></div>
    </div>
    ${body}
    <div id="fb"></div>`;
  document.getElementById("quit").onclick = home;

  if (q.type === "input") {
    const inputs = [...app.querySelectorAll("input[type=text]")];
    inputs[0].focus();
    if (q.listen) play(vAudio(q.verb, 1), q.verb[1]);
    document.getElementById("f").onsubmit = e => {
      e.preventDefault();
      const empty = inputs.find(i => !i.value.trim());
      if (empty) { empty.focus(); return; }
      let ok = true;
      inputs.forEach((inp, i) => {
        const good = check(inp.value, q.fields[i].answer, q.fields[i].needAll);
        inp.classList.add(good ? "ok" : "bad"); inp.readOnly = true;
        const f = q.fields[i], why = good ? "" : mistake(inp.value, f, q.verb);
        if (!good && (q.fields.length > 1 || why)) inp.insertAdjacentHTML("afterend", `<div class="fix">${q.fields.length > 1 ? `Richtig: <b>${disp(f.answer)}</b>${why ? " · " : ""}` : ""}${why}</div>`);
        ok = ok && good;
      });
      document.getElementById("go").remove();
      grade(ok);
    };
  } else if (q.type === "choice") {
    const opts = [...app.querySelectorAll(".opt")];
    opts.forEach(b => b.onclick = () => {
      const ok = b.textContent === q.answer;
      opts.forEach(o => { o.disabled = true; if (o.textContent === q.answer) o.classList.add("ok"); });
      if (!ok) b.classList.add("bad");
      grade(ok);
    });
  } else {
    document.getElementById("flip").onclick = e => {
      const v = q.verb;
      e.target.remove();
      document.getElementById("extra").innerHTML = `<div class="forms">
        <div><span>Simple Past</span><b>${disp(v[1])}</b>${sayBtn(vAudio(v, 1), v[1])}</div>
        <div><span>Past Participle</span><b>${disp(v[2])}</b>${sayBtn(vAudio(v, 2), v[2])}</div></div>
        ${q.tip ? `<p class="muted" style="margin:12px 0 0">${q.tip}</p>` : ""}`;
      if (store.sound) play(q.audio, q.sayText);
      document.getElementById("fb").innerHTML = `<div class="row" style="margin-top:12px">
        <button class="btn ghost" id="no">Nochmal üben</button><button class="btn" id="yes">Wusste ich!</button></div>`;
      document.getElementById("yes").onclick = () => { record(true); next(); };
      document.getElementById("no").onclick = () => { record(false); next(); };
    };
  }
  window.scrollTo(0, 0);
}

function record(ok) {
  const q = S.qs[S.i];
  // Falsche Antworten kommen am Ende der Runde noch einmal dran; gewertet wird nur der erste Versuch
  if (!q.retry) {
    if (ok) S.right++; else { S.wrong.push(q.solution); S.qs.push({ ...q, retry: true }); }
  }
  if (q.verb && !(q.retry && ok)) { store.p[q.verb[0]] = ok ? streak(q.verb) + 1 : 0; save(); }
}

function grade(ok) {
  const q = S.qs[S.i];
  record(ok);
  if (store.sound) play(q.audio, q.sayText);
  const praise = ["Richtig! 🎉", "Super! ⭐", "Genau! 👍", "Perfekt! 💪"];
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok ? "ok" : "bad"}">${ok ? praise[Math.floor(Math.random() * praise.length)] : "Noch nicht ganz."}
      <small>${q.solution} ${sayBtn(q.audio, q.sayText)}${!ok && q.tip ? "<br>" + q.tip : ""}</small></div>
    <button class="btn" id="next">${S.i + 1 < S.qs.length ? "Weiter" : "Ergebnis ansehen"}</button>`;
  const n = document.getElementById("next");
  n.onclick = next; n.focus();
}

function next() {
  S.i++;
  if (S.i < S.qs.length) showQ(); else result();
}

function result() {
  const total = S.total || S.qs.length, r = S.right;
  store.session = null; save();
  const msg = r === total ? "Alles richtig – stark! 🏆" : r >= total * 0.7 ? "Richtig gut! ⭐" : r >= total * 0.4 ? "Schon ganz ordentlich – weiter so! 💪" : "Übung macht den Meister – gleich nochmal! 🌱";
  app.innerHTML = `
    <div class="card center">
      <p class="score">${r} / ${total}</p>
      <p><b>${msg}</b></p>
    </div>
    ${S.wrong.length ? `<div class="card"><h2>Das schaust du dir nochmal an</h2><ul class="miss">${S.wrong.map(w => `<li>${w}</li>`).join("")}</ul></div>` : ""}
    <button class="btn" id="again">Nochmal</button>
    <p></p>
    <button class="btn ghost" id="home">Zur Übersicht</button>`;
  document.getElementById("again").onclick = () => start(S.mode);
  document.getElementById("home").onclick = home;
  window.scrollTo(0, 0);
}

if (store.session && store.session.qs && store.session.i < store.session.qs.length) { S = store.session; showQ(); }
else home();
</script>
</body>
</html>
