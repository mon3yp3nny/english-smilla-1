<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f9fb">
<link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Englisch">
<link rel="apple-touch-icon" href="icon.png">
<title>Englisch-Trainer: Irregular Verbs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦝</text></svg>">
<style>
  @font-face {
    font-family: "Bricolage Grotesque"; font-weight: 400 800; font-display: swap;
    src: url(fonts/bricolage-grotesque-latin.woff2) format("woff2");
  }
  /* Heft & Textmarker: Karopapier, Fineliner-Tinte, Textmarker nur für Zustände
     (gelb = aktuell/ausgewählt, grün = richtig/sicher, pink = falsch) */
  :root {
    color-scheme: light;
    --paper: #f8f9fb; --grid: #e2e7ef; --sheet: #ffffff; --ink: #1d2433; --muted: #525b6d; --hair: #cdd3de;
    --hl-y: #f6ea4f; --hl-g: #86eeb4; --hl-p: #ffa3c4; --on-hl: #1d2433;
    --ok: #0b7443; --bad: #b8124f;
    /* Lernstand in fünf Stufen: oft falsch, falsch, (neu), sicher, sehr sicher */
    --lv-m2: #ff94ba; --lv-m1: #ffd6e5; --lv-p1: #cdf8df; --lv-p2: #86eeb4;
    --lift: 0 12px 28px -14px rgba(29, 36, 51, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #121722; --grid: #1c2331; --sheet: #182030; --ink: #e8ecf4; --muted: #a2abbd; --hair: #323c52;
      --hl-y: #ece052; --hl-g: #74e0a6; --hl-p: #f29abb; --on-hl: #121722;
      --ok: #74e0a6; --bad: #f29abb;
      --lv-m2: #f29abb; --lv-m1: rgba(242, 154, 187, .2); --lv-p1: rgba(116, 224, 166, .18); --lv-p2: #74e0a6;
      --lift: 0 12px 28px -12px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #121722; --grid: #1c2331; --sheet: #182030; --ink: #e8ecf4; --muted: #a2abbd; --hair: #323c52;
    --hl-y: #ece052; --hl-g: #74e0a6; --hl-p: #f29abb; --on-hl: #121722;
    --ok: #74e0a6; --bad: #f29abb;
    --lv-m2: #f29abb; --lv-m1: rgba(242, 154, 187, .2); --lv-p1: rgba(116, 224, 166, .18); --lv-p2: #74e0a6;
    --lift: 0 12px 28px -12px rgba(0, 0, 0, .7);
  }
  :root { --karo: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); }
  * { box-sizing: border-box; }
  button, input, label, summary { touch-action: manipulation; }
  button { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; color: var(--ink); background-color: var(--paper);
    background-image: var(--karo); background-size: 24px 24px; background-position: -1px -1px;
    font: 400 18px/1.45 "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
    font-optical-sizing: auto; -webkit-text-size-adjust: 100%; caret-color: var(--ink);
  }
  ::selection { background: var(--hl-y); color: var(--on-hl); }
  :focus-visible { outline: 5px solid var(--hl-y); outline-offset: 0; }
  #app { max-width: 600px; margin: 0 auto; padding: 28px 16px 56px; padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) {
    body { font-size: 20px; }
    #app { max-width: 700px; padding: 52px 40px 72px; }
  }
  h1 { font-size: clamp(3rem, 11vw, 4.6rem); font-weight: 800; line-height: .92; letter-spacing: -.035em; margin: 0; }
  h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; margin: 0 0 8px; text-wrap: balance; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .center { text-align: center; }
  .ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* Textmarker: der Strich läuft von links nach rechts über das Wort */
  .mark {
    color: var(--on-hl); background: linear-gradient(var(--mk, var(--hl-y)), var(--mk, var(--hl-y))) no-repeat 0 var(--my, 72%) / 100% var(--mh, 80%);
    padding: 0 .14em; margin: 0 -.04em; border-radius: .06em .22em .1em .18em;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .mark.g { --mk: var(--hl-g); }
  .mark.p { --mk: var(--hl-p); }
  .swipe { animation: swipe .55s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes swipe {
    from { background-size: 0 var(--mh, 80%); color: var(--ink); }
    40% { color: var(--on-hl); }
    to { background-size: 100% var(--mh, 80%); }
  }
  @media (prefers-reduced-motion: reduce) { .swipe { animation: none; } }

  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; padding: 14px 20px;
    border-radius: 12px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
    font-weight: 700; font-size: 1.1rem; transition: transform .12s ease-out, box-shadow .2s ease-out;
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }

  /* Startseite */
  .title { margin: 0 0 6px; line-height: 1; }
  .title .mark { --mh: 76%; --my: 75%; padding: 0 .1em; margin: 0 -.1em; }
  .title + .muted { font-size: 1rem; margin: 10px 0 0; }
  .prog { display: block; width: 100%; margin: 34px 0 0; padding: 0; border: 0; background: none; text-align: left; }
  .prog .num { display: flex; align-items: baseline; gap: 14px; }
  .prog .num b { font-size: clamp(4.2rem, 16vw, 6rem); font-weight: 800; line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .prog .num span { color: var(--muted); font-size: 1.05rem; line-height: 1.25; }
  .strip { display: grid; grid-template-columns: repeat(35, 1fr); gap: 4px; margin-top: 18px; }
  .strip i { height: 22px; border-radius: 3px; background: var(--sheet); box-shadow: inset 0 0 0 1.5px var(--hair); }
  .strip i[class] { box-shadow: none; }
  @media (max-width: 499px) { .strip { grid-template-columns: repeat(14, 1fr); } .strip i { height: 16px; } }
  .strip i.m2 { background: var(--lv-m2); } .strip i.m1 { background: var(--lv-m1); }
  .strip i.p1 { background: var(--lv-p1); } .strip i.p2 { background: var(--lv-p2); }
  .prog small { display: block; color: var(--muted); font-size: .85rem; margin-top: 10px; }
  .section { margin: 44px 0 10px; font-size: 1.55rem; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; }
  .list { border-top: 2px solid var(--ink); }
  .item {
    display: flex; align-items: center; gap: 16px; width: 100%; min-height: 72px; text-align: left;
    background: none; border: 0; border-bottom: 1.5px solid var(--ink); padding: 14px 4px;
  }
  .item > span { flex: 1; }
  .item b { display: inline; font-size: 1.22rem; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; padding: 0 .16em; margin: 0 -.16em; border-radius: .14em .4em .2em .36em; transition: background-color .15s ease-out, color .15s ease-out; }
  .item .muted { display: block; font-size: .92rem; margin-top: 2px; }
  .item > .ico { width: 1.5em; height: 1.5em; transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
  .item:active b, .item:focus-visible b { background: var(--hl-y); color: var(--on-hl); }
  @media (hover: hover) { .item:hover b { background: var(--hl-y); color: var(--on-hl); } .item:hover > .ico { transform: translateX(4px); } }
  .btn.exam { justify-content: space-between; text-align: left; padding: 18px 22px; min-height: 80px; }
  .btn.exam b { display: block; font-size: 1.35rem; }
  .btn.exam span span { display: block; font-weight: 400; font-size: .92rem; opacity: .8; }
  .btn.exam .ico { width: 1.5em; height: 1.5em; }

  /* Einstellungen */
  label.check { display: flex; align-items: center; gap: 14px; font-size: 1rem; padding: 14px 4px; border-bottom: 1.5px solid var(--ink); cursor: pointer; }
  input[type=checkbox] {
    -webkit-appearance: none; appearance: none; flex: none; width: 26px; height: 26px; margin: 0;
    border: 2px solid var(--ink); border-radius: 6px; background: var(--sheet); display: grid; place-content: center; cursor: pointer;
  }
  input[type=checkbox]::after { content: ""; width: 7px; height: 13px; border: solid var(--on-hl); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
  input[type=checkbox]:checked { background: var(--hl-g); }
  input[type=checkbox]:checked::after { opacity: 1; }
  .seg-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 14px 4px; border-bottom: 1.5px solid var(--ink); }
  .seg { display: flex; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: var(--sheet); padding: 10px 14px; min-height: 44px; font-size: .95rem; font-weight: 600; }
  .seg button + button { border-left: 2px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--hl-y); color: var(--on-hl); font-weight: 700; }
  .foot { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .9rem; padding: 10px; min-height: 44px; }
  .link .ico { margin-right: 4px; }

  /* Übungsrunde */
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .x { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink); padding: 0; }
  .x .ico { width: 26px; height: 26px; }
  .bar { flex: 1; height: 14px; border-radius: 99px; box-shadow: inset 0 0 0 2px var(--ink); background: var(--sheet); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--hl-y); box-shadow: inset 0 0 0 2px var(--ink); border-radius: 99px; transition: width .4s cubic-bezier(.16, 1, .3, 1); }
  .count { font-size: .95rem; font-weight: 600; color: var(--muted); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .q { text-align: center; padding: 40px 0 28px; }
  .q .tag { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; font-size: .9rem; font-weight: 700; }
  .q .head { font-size: clamp(2.6rem, 10vw, 3.8rem); font-weight: 800; line-height: 1.1; letter-spacing: -.03em; text-wrap: balance; }
  .q .head.sentence { font-size: clamp(1.5rem, 5vw, 1.9rem); font-weight: 600; line-height: 1.35; letter-spacing: -.01em; }
  .q .sub { color: var(--muted); margin-top: 12px; font-size: 1.05rem; text-wrap: balance; }
  .q .sub b { color: var(--ink); }
  .say {
    display: inline-grid; place-items: center; width: 44px; height: 44px; margin-left: 10px; vertical-align: middle; padding: 0;
    border: 2px solid var(--ink); border-radius: 50%; background: var(--sheet); color: var(--ink);
    font-size: 1rem; font-weight: 700; letter-spacing: 0; transition: transform .12s ease-out;
  }
  .say .ico { width: 20px; height: 20px; }
  .say:active { transform: scale(.92); background: var(--hl-y); color: var(--on-hl); }
  .say.big { display: inline-flex; gap: 10px; width: auto; height: auto; margin: 0; padding: 16px 30px; border-radius: 99px; background: var(--ink); color: var(--paper); font-size: 1.3rem; }
  .say.big .ico { width: 26px; height: 26px; }
  .blank { display: inline-block; min-width: 2.6em; border-bottom: 3px solid var(--ink); padding: 0 4px; line-height: 1.1; }
  .hint { display: inline-block; background: linear-gradient(var(--hl-y), var(--hl-y)) no-repeat 0 72% / 100% 80%; color: var(--on-hl); border-radius: .06em .22em .1em .18em; padding: 0 .3em; font-weight: 700; }

  .field { margin: 14px 0; }
  .field label { display: block; font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 14px 16px; font: inherit; font-size: 1.3rem; font-weight: 600; color: var(--ink);
    background: var(--sheet); border: 2px solid var(--ink); border-radius: 12px; outline: none;
    transition: box-shadow .15s ease-out;
  }
  input[type=text]:focus { box-shadow: 0 0 0 5px var(--hl-y); }
  input.ok { border-color: var(--ok); background: var(--lv-p1); box-shadow: none !important; }
  input.bad { border-color: var(--bad); background: var(--lv-m1); box-shadow: none !important; }
  .fix { color: var(--bad); font-size: .95rem; font-weight: 600; margin-top: 6px; }
  .fix b { color: var(--ink); }
  #go { margin-top: 20px; }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0 12px; }
  .opt {
    min-height: 72px; padding: 16px 12px; border-radius: 12px; border: 2px solid var(--ink); background: var(--sheet);
    font-weight: 700; font-size: 1.2rem; transition: transform .12s ease-out, opacity .2s;
  }
  .opt:active { transform: scale(.97); }
  @media (hover: hover) { .opt:not(:disabled):hover { background: var(--hl-y); color: var(--on-hl); } }
  .opt:disabled { cursor: default; opacity: .45; color: var(--ink); }
  .opt.ok, .opt.bad { opacity: 1; color: var(--on-hl); }
  .opt.ok { background: var(--hl-g); }
  .opt.bad { background: var(--hl-p); }

  .fb { border-top: 2px solid var(--ink); padding: 18px 4px 4px; margin: 20px 0 18px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.01em; }
  .fb small { display: block; font-weight: 500; font-size: 1.05rem; letter-spacing: 0; margin-top: 10px; line-height: 1.5; }
  .fb small .say { width: 38px; height: 38px; margin-left: 6px; }
  .fb .blank, ul.miss .blank { border: 0; min-width: 0; padding: 0 .12em; background: linear-gradient(var(--hl-g), var(--hl-g)) no-repeat 0 72% / 100% 80%; color: var(--on-hl); border-radius: .06em .22em .1em .18em; }
  .fb .tip { display: block; color: var(--muted); margin-top: 8px; }
  .fb .tip b { color: var(--ink); }

  .forms { display: grid; margin-top: 28px; text-align: left; border-top: 2px solid var(--ink); }
  .forms > div { padding: 12px 4px; border-bottom: 1.5px solid var(--ink); }
  .forms span { display: block; font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
  .forms b { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
  .forms .say { width: 38px; height: 38px; }
  .forms + .muted { margin-top: 14px !important; }
  .rules { margin: 28px 0 0; font-size: .98rem; border-top: 2px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
  .rules summary { display: flex; align-items: center; justify-content: space-between; min-height: 56px; font-weight: 700; font-size: 1.1rem; cursor: pointer; list-style: none; padding: 0 4px; }
  .rules summary::-webkit-details-marker { display: none; }
  .rules summary .ico { width: 1.3em; height: 1.3em; transition: transform .25s cubic-bezier(.16, 1, .3, 1); }
  .rules[open] summary .ico { transform: rotate(45deg); }
  .rules > *:not(summary) { margin-left: 4px; margin-right: 4px; }
  .rules .forms { margin-top: 10px; border-top-width: 1.5px; }
  .rules .forms b { font-size: 1.3rem; }
  .rules i { color: var(--muted); }
  .rules ul { padding-left: 20px; margin: 16px 4px 18px; }
  .rules li { margin: 10px 0; }

  .score { text-align: center; margin: 48px 0 12px; }
  .score b { font-size: clamp(5rem, 22vw, 8rem); font-weight: 800; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .score + p { font-size: 1.3rem; font-weight: 700; margin-bottom: 28px; }
  .miss-box { border-top: 2px solid var(--ink); padding-top: 16px; margin-bottom: 28px; }
  ul.miss { padding-left: 0; list-style: none; margin: 8px 0 0; }
  ul.miss li { padding: 10px 4px; border-bottom: 1.5px solid var(--hair); font-weight: 600; }
  ul.miss .blank { font-weight: 800; }

  /* Liste */
  .top h2 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -.025em; }
  .intro { color: var(--muted); font-size: .95rem; max-width: 62ch; margin: 8px 0 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .chip {
    min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--ink);
    background: var(--sheet); font-size: .92rem; font-weight: 600;
  }
  .chip small { font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; opacity: .75; }
  .chip.on { background: var(--hl-y); color: var(--on-hl); font-weight: 700; }
  /* Farb-Knöpfe über der Liste: behalten ihre Farbe, angekreuzt bekommen sie einen Rand */
  .legend { margin: 0 0 18px; }
  .legend .chip { border-color: transparent; box-shadow: inset 0 0 0 1.5px var(--hair); }
  .legend .chip.on { background: var(--sheet); color: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
  /* Kräftige Stufen auf Zeile und Zellen (nur eins von beiden lässt bei krummen Spaltenbreiten
     einen Haarspalt), die durchscheinenden nur auf der Zeile (sonst doppelt deckend) */
  .legend .chip.m2, tr.m2, tr.m2 td { background: var(--lv-m2); }
  .legend .chip.m1, tr.m1 { background: var(--lv-m1); }
  .legend .chip.p1, tr.p1 { background: var(--lv-p1); }
  .legend .chip.p2, tr.p2, tr.p2 td { background: var(--lv-p2); }
  /* kräftige Stufen sind echter Textmarker: dunkle Schrift darauf */
  .legend .chip.m2, .legend .chip.p2, tr.m2 td, tr.p2 td { color: var(--on-hl); }
  .legend .chip:disabled { opacity: .4; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th { text-align: left; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 6px 8px; position: sticky; top: 0; z-index: 1; background: var(--paper); box-shadow: inset 0 -2px 0 var(--ink); }
  td { padding: 10px 6px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  td:nth-child(2) { font-weight: 700; }
  th.pick, td.pick { width: 44px; padding: 0; }
  td.pick label { display: block; padding: 8px 8px 8px 4px; cursor: pointer; }
  td.pick input { display: grid; width: 24px; height: 24px; }
  th.pick .link { padding: 4px 8px 4px 6px; min-height: 0; text-decoration: none; }
  td.de { color: var(--muted); }
  tr.m2 td.de, tr.p2 td.de { color: var(--on-hl); }
  tr[data-say] { cursor: pointer; }
  td[data-say]:active { background: var(--hl-y); color: var(--on-hl); }
  tr.now td { background: var(--hl-y); color: var(--on-hl); }
  td .ico.done { width: 1em; height: 1em; margin-left: 4px; stroke-width: 3; color: var(--ok); }
  tr.m2 td .ico.done, tr.p2 td .ico.done { color: var(--on-hl); }
  .tour { position: sticky; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; margin-top: 18px; pointer-events: none; }
  .tour .btn, .st-ctl .btn { display: inline-flex; width: auto; padding: 16px 28px; font-size: 1.15rem; border-radius: 99px; box-shadow: var(--lift); pointer-events: auto; }
  .tour .btn.ghost, .st-ctl .btn.ghost { background: var(--sheet); }
  .tour .btn[hidden], .st-ctl .btn[hidden], .stage[hidden] { display: none; }
  /* Vollbild beim Vorlesen: das gerade gesprochene Wort steht groß in der Mitte und bekommt den Textmarker */
  .stage {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center;
    background-color: var(--paper); background-image: var(--karo); background-size: 24px 24px; background-position: -1px -1px;
    padding: calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  }
  .stage .x { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; }
  .st-count { display: flex; align-items: center; gap: 6px; min-height: 44px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .st-body { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; }
  .st-top { font-size: min(5vh, 6.5vw); font-weight: 600; color: var(--muted); margin-bottom: 3vh; }
  .st-line { font-weight: 800; line-height: 1.25; letter-spacing: -.03em; white-space: nowrap; }
  .st-top.on, .st-line.on { color: var(--ink); }
  .st-line.off { visibility: hidden; }
  .st-ctl { display: flex; gap: 8px; }
</style>
</head>
<body>
<main id="app"></main>

<script>
// ---------- Daten: List of irregular verbs (S. 215–217) ----------

// Dateinamen der Audios – wird auch von tools/gen-audio.js benutzt
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const plain = (sentence, answer) => {
  let word = answer.split("/")[0];
  if (sentence.startsWith("___")) word = word[0].toUpperCase() + word.slice(1);
  return sentence.replace(" (not)", "").replace("___", word);
};
// Beispiel mit "I" für "Alle vorlesen": "I am, I was, I have been"
const example = v => {
  const f = i => v[i].split("/")[0].replace(/ ?\(.*?\)/g, "");
  return [v[0] === "be" ? "am" : f(0), f(1), "have " + f(2)].map(t => "I " + t);
};

store.pp = !!store.pp;
store.sel = (store.sel || []).filter(n => VERBS.some(v => v[0] === n));   // angekreuzte Verben (Infinitive); leer = alle
// Früher wählte man eine Gruppe (1–3) statt einzelner Verben – als Auswahl übernehmen
if (store.range && !store.sel.length) store.sel = VERBS.slice(...RANGES[store.range - 1].slice(1)).map(v => v[0]);
delete store.range;
if (store.sound === undefined) store.sound = true;
if (!["light", "dark"].includes(store.theme)) store.theme = "auto";   // Aussehen: hell, dunkel oder wie das Gerät
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

function applyTheme() {
  if (store.theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = store.theme;
  const dark = store.theme === "dark" || (store.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#121722" : "#f8f9fb";

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const disp = form => form.split("/").join(", ");
const streak = v => store.p[v[0]] || 0;
const isDone = v => streak(v) >= 2;
// Lernstand in fünf Stufen für die Liste: -2 oft falsch, -1 falsch, 0 neu, 1 sicher, 2 sehr sicher
const level = v => {
  const s = streak(v), m = store.m[v[0]] || 0;
  return s >= 4 ? 2 : s >= 2 ? 1 : m >= 3 ? -2 : m >= 1 || store.p[v[0]] === 0 ? -1 : 0;
};
// Geübt werden die angekreuzten Verben – ohne Auswahl alle
const pool = () => store.sel.length ? VERBS.filter(v => store.sel.includes(v[0])) : VERBS;

function norm(s) {
  return s.toLowerCase().replace(/[’`´]/g, "'").replace(/[().!?]/g, "").replace(/\s+/g, " ").trim();
}
function expand(form) {
  return form.split("/").flatMap(a => a.includes("(") ? [norm(a), norm(a.replace(/\(.*?\)/g, ""))] : [norm(a)]);
}
// needAll: alle Alternativen müssen genannt werden (was UND were)
function check(input, form, needAll) {
  const alts = expand(form), n = norm(input).replace(/^to /, "");
  if (!n) return false;
  if (!needAll && alts.includes(n)) return true;
  const parts = n.split(/[,\/]|\s+/).filter(p => p && !["and", "or", "und", "oder"].includes(p));
  return parts.length > 0 && parts.every(p => alts.includes(p)) && (!needAll || alts.every(a => parts.includes(a)));
}

// Spielt die MP3 ab; falls das nicht klappt, liest die Browser-Stimme vor
const player = new Audio();
// done (optional) wird aufgerufen, sobald fertig vorgelesen ist
function play(file, text, done, lang) {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  player.onended = done || null;
  player.onerror = () => speak(text, done, lang);
  player.src = `audio/${file}.mp3`;
  const p = player.play();
  if (p) p.catch(() => {});
}
function speak(text, done, lang) {
  if (!text || !("speechSynthesis" in window)) { if (done) done(); return; }
  const u = new SpeechSynthesisUtterance(text.replace(/[()\/]/g, " "));
  u.lang = lang || "en-GB"; u.rate = 0.9;
  if (done) u.onend = u.onerror = done;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const vAudio = (v, i) => `v/${slug(v[0])}-${i}`;
const sayBtn = (file, text) => `<button type="button" class="say" data-audio="${file}" data-say="${text}" aria-label="Anhören">${icon("speaker")}</button>`;
const fill = (sentence, word) => {
  if (sentence.startsWith("___")) word = word[0].toUpperCase() + word.slice(1);
  return sentence.replace(/ \(not\)/, "").replace("___", `<span class="blank">${word || "&nbsp;"}</span>`);
};

app.addEventListener("click", e => {

    app.querySelectorAll("[data-theme-pick]").forEach(o => o.setAttribute("aria-pressed", o === b));
  });
  document.getElementById("reload").onclick = () => location.reload();
  document.getElementById("reset").onclick = () => { if (confirm("Wirklich den ganzen Fortschritt löschen?")) { store.p = {}; store.m = {}; save(); home(); } };
  window.scrollTo(0, 0);
}

// ---------- Liste ----------
// "Alle vorlesen": je Verb zwei Vollbild-Seiten – deutsches Wort mit den drei Formen,
// dann ein Beispiel ("ich bin" – "I am", "I was", "I have been"). Jede Zeile hat ihre eigene Aufnahme.
// Sind in der Liste Verben angekreuzt, werden nur diese vorgelesen – in einer Schleife, bis man Pause drückt.
let tour = 0, tourAt = 0, tourTimer;   // tour = Nummer des laufenden Durchgangs (0 = aus), tourAt = aktuelle Stelle in tourQ
let tourQ = [];                        // Verb-Indizes, die der Durchgang vorliest
let stageOpen = false, wake = null;
// Seite: [deutsche Überschrift, Datei dazu, [[Anzeige, Datei, Text für die Browser-Stimme], ...]]
const pages = v => [
  [v[3], "de", [0, 1, 2].map(i => [disp(v[i]), i, v[i]])],
  [v[4], "ich", example(v).map((t, i) => [t, "ex" + i, t])]
];
// Bildschirm bleibt an, solange vorgelesen wird (wo der Browser das kann)
function keepAwake(on) {
  try {
    if (on) navigator.wakeLock.request("screen").then(w => { if (tour) wake = w; else w.release(); }, () => {});
    else if (wake) { wake.release(); wake = null; }
  } catch (e) {}
}
function tourUI() {
  const n = store.sel.length;
  app.querySelectorAll("[data-tour=toggle]").forEach(b => b.innerHTML = tour ? icon("pause") + "Pause" : tourAt ? icon("play") + "Weiter" : n ? `${icon("loop")}${n} ${n > 1 ? "Verben" : "Verb"} anhören` : icon("play") + "Alle vorlesen");
  const clear = document.getElementById("clearSel");
  if (clear) clear.hidden = !n;
  app.querySelectorAll("[data-tour=reset]").forEach(b => b.hidden = !!tour || !tourAt);
  const st = document.getElementById("stage");
  if (st) st.hidden = !stageOpen;
}
// k = Zeile, die gerade gesprochen wird (-1 = die deutsche Überschrift); spätere Zeilen sind noch unsichtbar
function showStage(i, p, k) {
  const [top, , lines] = pages(VERBS[i])[p], len = Math.max(...lines.map(l => l[0].length));
  document.getElementById("stCount").innerHTML = `${store.sel.length ? icon("loop") : ""}${tourAt + 1} / ${tourQ.length}`;
  const body = document.getElementById("stBody");
  body.style.fontSize = `min(14vh, ${Math.min(24, 170 / len).toFixed(1)}vw)`;
  const mark = (t, on) => on ? `<span class="mark swipe">${t}</span>` : t;
  body.innerHTML = `<div class="st-top ${k < 0 ? "on" : ""}">${mark(top, k < 0)}</div>` +
    lines.map((l, j) => `<div class="st-line ${j === k ? "on" : j > k ? "off" : ""}">${mark(l[0], j === k)}</div>`).join("");
}
// Pause merkt sich das Verb; "Weiter" fängt bei diesem Verb wieder an
function pauseTour() {
  if (!tour) return;
  tour = 0; clearTimeout(tourTimer);
  player.onended = null; player.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  keepAwake(false);
  tourUI();
}
function resetTour() {
  pauseTour(); tourAt = 0; stageOpen = false;
  app.querySelectorAll("tr.now").forEach(r => r.classList.remove("now"));
  tourUI();
}
function startTour() {
  const id = tour = Date.now(), rows = [...app.querySelectorAll("tr[data-say]")];
  const wait = (ms, fn) => () => { if (tour === id) tourTimer = setTimeout(() => { if (tour === id) fn(); }, ms); };
  const loop = store.sel.length > 0;
  tourQ = VERBS.map((v, i) => i).filter(i => !loop || store.sel.includes(VERBS[i][0]));
  const step = n => {
    rows.forEach(r => r.classList.remove("now"));
    if (n >= tourQ.length) { if (!loop) return resetTour(); n = 0; }
    const i = tourQ[n], v = VERBS[i];
    tourAt = n;
    rows[i].classList.add("now");
    rows[i].scrollIntoView({ block: "center" });
    // [Seite, Zeile, Datei, Text für die Browser-Stimme, Sprache, Pause danach]
    const clips = pages(v).flatMap(([top, file, lines], p) => [
      [p, -1, file, top, "de-DE", 400],
      ...lines.map((l, k) => [p, k, l[1], l[2], "", k < 2 ? 350 : p ? 1400 : 900])
    ]);
    const run = c => {
      if (c >= clips.length) return step(n + 1);
      const [p, k, file, text, lang, gap] = clips[c];
      showStage(i, p, k);
      play(vAudio(v, file), text, wait(gap, () => run(c + 1)), lang);
    };
    run(0);
  };
  stageOpen = true;
  keepAwake(true);
  step(tourAt);
  tourUI();
}

function list() {
  app.innerHTML = `
    <div class="top"><button class="x" id="back" aria-label="Zurück">${icon("back")}</button><h2>Alle Verben</h2></div>
    <p class="intro">Tippe auf ein Wort, um es zu hören – oder auf die Übersetzung für alle drei Formen. Mit dem großen Knopf unten hörst und siehst du alle Verben nacheinander – ganz groß und mit Pause-Taste. Kreuze Verben an – einzeln oder mit den Knöpfen für Gruppen und Farben –, dann übst und hörst du nur diese – das Vorlesen läuft dann immer wieder von vorn.</p>
    <div class="chips">${RANGES.map((r, i) => `<button class="chip" data-group="${i}">${r[0]}</button>`).join("")}</div>
    <div class="chips legend">${[["m2", "oft falsch"], ["m1", "falsch"], ["", "neu"], ["p1", "sicher"], ["p2", "sehr sicher"]].map(([c, name], i) => {
      const n = VERBS.filter(v => level(v) === i - 2).length;
      return `<button class="chip ${c}" data-level="${i - 2}" ${n ? "" : "disabled"}>${name} <small>${n}</small></button>`;
    }).join("")}</div>
    <table>
      <tr><th class="pick"><button class="link" id="clearSel" aria-label="Auswahl aufheben" hidden>${icon("close")}</button></th><th>infinitive</th><th>simple past</th><th>past participle</th><th>German</th></tr>
      ${VERBS.map(v => `<tr class="${isDone(v) ? "done" : ""} ${["m2", "m1", "", "p1", "p2"][level(v) + 2]}" data-audio="${vAudio(v, "all")}" data-say="${verbAudio(v).sayText}"><td class="pick"><label><input type="checkbox" value="${v[0]}" aria-label="${v[0]} auswählen" ${store.sel.includes(v[0]) ? "checked" : ""}></label></td>${[0, 1, 2].map(i => `<td data-audio="${vAudio(v, i)}" data-say="${v[i]}">${disp(v[i])}${i === 0 && isDone(v) ? icon("check").replace('class="ico"', 'class="ico done"') : ""}</td>`).join("")}<td class="de">${v[3]}</td></tr>`).join("")}
    </table>
    <div class="tour"><button class="btn ghost" data-tour="reset" hidden>${icon("restart")}Von vorn</button><button class="btn" data-tour="toggle"></button></div>
    <div class="stage" id="stage" hidden>
      <button class="x" data-tour="close" aria-label="Schließen">${icon("close")}</button>
      <div class="st-count" id="stCount"></div>
      <div class="st-body" id="stBody"></div>
      <div class="st-ctl"><button class="btn ghost" data-tour="reset" hidden>${icon("restart")}Von vorn</button><button class="btn" data-tour="toggle"></button></div>
    </div>`;
  tourAt = 0; stageOpen = false;
  document.getElementById("back").onclick = () => { resetTour(); home(); };
  const act = { toggle: () => tour ? pauseTour() : startTour(), reset: () => { resetTour(); startTour(); }, close: () => { pauseTour(); stageOpen = false; tourUI(); } };
  app.querySelectorAll("[data-tour]").forEach(b => b.onclick = act[b.dataset.tour]);
  // Ankreuzen: eine geänderte Auswahl fängt wieder beim ersten Verb an
  const boxes = [...app.querySelectorAll("td.pick input")];
  // Gruppen aus dem Buch: ein Tipp kreuzt alle Verben der Gruppe an (oder wieder ab, wenn schon alle angekreuzt sind)
  // Genauso die Farb-Knöpfe: alle Verben mit diesem Lernstand
  const chips = [...app.querySelectorAll("[data-group], [data-level]")];
  const group = c => c.dataset.level ? boxes.filter((b, i) => level(VERBS[i]) === +c.dataset.level) : boxes.slice(RANGES[c.dataset.group][1], RANGES[c.dataset.group][2]);
  const pick = () => {
    resetTour(); store.sel = boxes.filter(b => b.checked).map(b => b.value); save(); tourUI();
    chips.forEach(c => c.classList.toggle("on", group(c).length > 0 && group(c).every(b => b.checked)));
  };
  chips.forEach(c => c.onclick = () => { const on = !group(c).every(b => b.checked); group(c).forEach(b => b.checked = on); pick(); });
  app.querySelector("table").onclick = e => { if (e.target.closest(".pick")) e.stopPropagation(); };   // kein Vorlesen beim Ankreuzen
  boxes.forEach(b => b.onchange = pick);
  document.getElementById("clearSel").onclick = () => { boxes.forEach(b => b.checked = false); pick(); };
  pick();
  window.scrollTo(0, 0);
}

// ---------- Fragen bauen ----------
// Zuerst die zuletzt falsch beantworteten Verben, dann die neuen, dann die schon gekonnten; bei Gleichstand zufällig
const rank = v => store.p[v[0]] === 0 ? -1 : streak(v);
const pickVerbs = () => shuffle(pool()).sort((a, b) => rank(a) - rank(b)).slice(0, SESSION_LEN);
const solution = v => `${v[0]} – ${disp(v[1])} – ${disp(v[2])}`;
const verbAudio = v => ({ audio: vAudio(v, "all"), sayText: `${v[0]}, ${v[1]}, ${v[2]}` });
const sentenceAudio = (s, answer) => ({ audio: "s/" + slug(plain(s, answer)), sayText: plain(s, answer) });

// Eselsbrücken: Verben, die sich gleich verhalten
const PATTERNS = [
  [v => v[0] === v[1] && v[1] === v[2], "Alle drei Formen werden gleich geschrieben"],
  [v => /ought$/.test(v[1]), "2. und 3. Form enden auf -ought"],
  [v => v[0].includes("i") && v[1] === v[0].replace("i", "a") && v[2] === v[0].replace("i", "u"), "Aus i wird a und dann u"],
  [v => /ew$/.test(v[1]) && /wn$/.test(v[2]), "2. Form mit -ew, 3. Form mit -wn"],
  [v => v[2] === v[0], "Die 3. Form ist wie die Grundform"],
  [v => v[1] === v[2], "2. und 3. Form sind gleich"]
];
function verbTip(v) {
  if (v[0] === "read") return "Merke: Alle drei Formen werden gleich geschrieben – aber die 2. und 3. Form spricht man wie <b>red</b>.";
  const i = PATTERNS.findIndex(p => p[0](v));
  if (i < 0) return "";
  const like = i === PATTERNS.length - 1 ? [] : VERBS.filter(o => o !== v && PATTERNS.findIndex(p => p[0](o)) === i).slice(0, 3);
  return `Merke: ${PATTERNS[i][1]}${like.length ? " – wie bei <b>" + like.map(o => o[0]).join(", ") + "</b>" : ""}.`;
}

// Erklärt typische Verwechslungen, damit klar wird, was schiefging
function mistake(val, f, v) {
  if (!v || !f.kind) return "";
  if (f.kind === "inf") {
    const o = VERBS.find(o => o[0] !== v[0] && check(val, o[0]));
    return o ? `„${o[0]}“ heißt ${o[3]}.` : "";
  }
  if (f.kind === "past") {
    if (v[1] !== v[2] && check(val, v[2])) return "Das ist die 3. Form.";
    if (v[1] !== v[0] && check(val, v[0])) return "Das ist die Grundform.";
    if (norm(val) === fakeRegular(v)) return "Dieses Verb ist unregelmäßig – ohne -ed!";
  }
  if (f.kind === "pp" && v[1] !== v[2] && check(val, v[1])) return "Das ist die 2. Form.";
  return "";
}

function fakeRegular(v) {
  const words = v[0].replace(/ \(.*\)/, "").split(" ");
  words[0] += words[0].length > 2 && words[0].endsWith("e") ? "d" : "ed";
  return words.join(" ");
}

function quizQuestion(v) {
  if (Math.random() < 0.6) {
    const opts = new Set([disp(v[1])]), fake = fakeRegular(v);
    if (!expand(v[1]).includes(fake)) opts.add(fake);   // "learned" wäre ja richtig
    if (v[2] !== v[1]) opts.add(disp(v[2]));
    for (const o of shuffle(VERBS)) { if (opts.size >= 4) break; opts.add(disp(o[1])); }
    return { type: "choice", verb: v, ...verbAudio(v), tip: verbTip(v), head: v[0], say: v[0], sub: `${v[3]}<br>Wie heißt das <b>Simple Past</b>?`, options: shuffle([...opts]), answer: disp(v[1]), solution: solution(v) };
  }
  const tokens = v[3].split("; ");
  const others = shuffle(VERBS).filter(o => o !== v && !o[3].split("; ").some(t => tokens.includes(t))).slice(0, 3);
  return { type: "choice", verb: v, audio: vAudio(v, 0), sayText: v[0], head: v[3], sub: "Wie heißt das auf Englisch?", options: shuffle([v, ...others].map(o => o[0])), answer: v[0], solution: `${v[3]} = ${v[0]}` };
}

function build(mode) {
  if (mode === "cards") return pickVerbs().map(v => ({ type: "card", tip: verbTip(v), verb: v, ...verbAudio(v), head: v[0], say: v[0], sub: v[3], solution: solution(v) }));
  if (mode === "quiz") return pickVerbs().map(quizQuestion);
  if (mode === "write") return pickVerbs().map(v => ({
    type: "input", tip: verbTip(v), verb: v, ...verbAudio(v), head: v[0], say: v[0], sub: v[3], solution: solution(v),
    fields: [{ kind: "past", label: "Simple Past (2. Form)", answer: v[1], needAll: v[0] === "be" }]
      .concat(store.pp ? [{ kind: "pp", label: "Past Participle (3. Form)", answer: v[2] }] : [])
  }));
  if (mode === "exam") {
    const sent = shuffle(SENTENCES), special = s => s[1].includes("/");   // immer auch eine Verneinung oder Frage
    return [...build("waswere").slice(0, 3).map(q => ({ ...q, rules: false })), ...build("vocab").slice(0, 5), ...[...sent.filter(s => !special(s)).slice(0, 3), sent.find(special)].map(sentenceQ)];
  }
  if (mode === "vocab") return pickVerbs().map(v => ({
    type: "input", tip: verbTip(v), sentence: true, verb: v, ...verbAudio(v), head: v[3], sub: "Wie heißt das Verb auf Englisch?", solution: solution(v),
    fields: [{ kind: "inf", label: "Infinitive (1. Form)", answer: v[0] }, { kind: "past", label: "Simple Past (2. Form)", answer: v[1], needAll: v[0] === "be" }]
      .concat(store.pp ? [{ kind: "pp", label: "Past Participle (3. Form)", answer: v[2] }] : [])
  }));
  if (mode === "listen") return pickVerbs().map(v => ({
    type: "input", tip: verbTip(v), listen: true, verb: v, ...verbAudio(v), sub: v[3], solution: solution(v),
    head: `<button type="button" class="say big" data-audio="${vAudio(v, 1)}" data-say="${v[1]}">${icon("speaker")}Anhören</button>`,
    fields: [{ kind: "past", label: "Welche Simple-Past-Form hörst du?", answer: v[1], needAll: v[0] === "be" }]
  }));
  if (mode === "waswere") return shuffle(WAS_WERE).slice(0, SESSION_LEN).map(s => ({
    type: "choice", sentence: true, ...sentenceAudio(s[0], s[1]), head: s[0].replace("___", '<span class="blank">&nbsp;</span>'),
    sub: "Was passt in die Lücke?", options: ["was", "were", "wasn't", "weren't"], answer: s[1], solution: fill(s[0], s[1]),
    tip: "Merke: " + s[2], rules: true
  }));
  return shuffle(SENTENCES).slice(0, SESSION_LEN).map(sentenceQ);
}

function sentenceQ(s) {
  return {
    type: "input", sentence: true, ...sentenceAudio(s[0], s[2]), head: s[0].replace("___", '<span class="blank">&nbsp;</span>'),
    sub: `<span class="hint">(${s[1]})</span>`, fields: [{ label: "Was gehört in die Lücke?", answer: s[2] }],
    solution: fill(s[0], s[2].split("/")[0]),
    tip: s[1].includes("/") ? "Merke: Bei Verneinung und Fragen steht <b>did / didn't + Grundform</b>." : ""
  };
}

// ---------- Übungsrunde ----------
let S;
// Merkzettel für "was oder were?" – steht aufklappbar unter den Fragen
const RULES = `
  <p><b>was</b> und <b>were</b> sind das Simple Past von <b>to be</b> (sein): ich <u>war</u>, du <u>warst</u>, wir <u>waren</u> …</p>
  <div class="forms">
    <div><span>I · he · she · it</span><b>was</b><br>I was at home. <i>– Ich war zu Hause.</i><br>My sister was ill. <i>– Meine Schwester war krank.</i></div>
    <div><span>you · we · they</span><b>were</b><br>We were at the cinema. <i>– Wir waren im Kino.</i><br>The children were tired. <i>– Die Kinder waren müde.</i></div>
  </div>
  <ul>
    <li><b>Eine</b> Person oder Sache (my sister = she, the film = it) → <b>was</b>.<br><b>Mehrere</b> (the children, Tom and Lisa = they) → <b>were</b>.</li>
    <li>Bei <b>you</b> immer <b>were</b>, auch bei nur einer Person:<br>You were late. <i>– Du warst zu spät.</i></li>
    <li>Mit <b>not</b> (Verneinung): <b>wasn't</b> = was not, <b>weren't</b> = were not.<br>He wasn't at school. <i>– Er war nicht in der Schule.</i></li>
    <li>In <b>Fragen</b> steht was/were vorne:<br>Were you at the party? <i>– Warst du auf der Party?</i><br>Where were you? <i>– Wo warst du?</i></li>
  </ul>`;

function start(mode) {
  S = { mode, qs: build(mode), i: 0, right: 0, wrong: [] };
  S.total = S.qs.length;
  showQ();
}

function showQ() {
  const q = S.qs[S.i];
  store.session = S; save();   // nach einem Neuladen geht es an derselben Stelle weiter
  let body = "";
  if (q.type === "input") {
    body = `<form id="f" autocomplete="off">
      ${q.fields.map((f, i) => `<div class="field"><label for="in${i}">${f.label}</label>
        <input type="text" id="in${i}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${i < q.fields.length - 1 ? "next" : "done"}"></div>`).join("")}
      <button class="btn" id="go">Prüfen</button></form>`;
  } else if (q.type === "choice") {
    body = `<div class="opts">${q.options.map(o => `<button class="opt">${o}</button>`).join("")}</div>`;
  } else {
    body = `<button class="btn" id="flip">Aufdecken</button>`;
  }
  app.innerHTML = `
    <div class="top">
      <button class="x" id="quit" aria-label="Beenden">${icon("close")}</button>
      <div class="bar"><i style="width:${S.i / S.qs.length * 100}%"></i></div>
      <span class="count">${S.i + 1} / ${S.qs.length}</span>
    </div>
    <div class="q">
      ${q.retry ? `<div class="tag mark p">${icon("loop")}Nochmal</div>` : ""}
      <div class="head ${q.sentence ? "sentence" : ""}">${q.head}${q.say ? sayBtn(vAudio(q.verb, 0), q.say) : ""}</div>
      <div class="sub">${q.sub}</div>
      <div id="extra"></div>
    </div>
    ${body}
    <div id="fb"></div>
    ${q.rules ? `<details class="rules" ${S.i === 0 ? "open" : ""}><summary>Wann was, wann were?${icon("plus")}</summary>${RULES}</details>` : ""}`;
  document.getElementById("quit").onclick = home;

  if (q.type === "input") {
    const inputs = [...app.querySelectorAll("input[type=text]")];
    inputs[0].focus();
    if (q.listen) play(vAudio(q.verb, 1), q.verb[1]);
    document.getElementById("f").onsubmit = e => {
      e.preventDefault();
      const empty = inputs.find(i => !i.value.trim());
      if (empty) { empty.focus(); return; }
      let ok = true;
      inputs.forEach((inp, i) => {
        const good = check(inp.value, q.fields[i].answer, q.fields[i].needAll);
        inp.classList.add(good ? "ok" : "bad"); inp.readOnly = true;
        const f = q.fields[i], why = good ? "" : mistake(inp.value, f, q.verb);
        if (!good && (q.fields.length > 1 || why)) inp.insertAdjacentHTML("afterend", `<div class="fix">${q.fields.length > 1 ? `Richtig: <b>${disp(f.answer)}</b>${why ? " · " : ""}` : ""}${why}</div>`);
        ok = ok && good;
      });
      document.getElementById("go").remove();
      grade(ok);
    };
  } else if (q.type === "choice") {
    const opts = [...app.querySelectorAll(".opt")];
    opts.forEach(b => b.onclick = () => {
      const ok = b.textContent === q.answer;
      opts.forEach(o => { o.disabled = true; if (o.textContent === q.answer) o.classList.add("ok"); });
      if (!ok) b.classList.add("bad");
      grade(ok);
    });
  } else {
    document.getElementById("flip").onclick = e => {
      const v = q.verb;
      e.target.remove();
      document.getElementById("extra").innerHTML = `<div class="forms">
        <div><span>Simple Past (2. Form)</span><b class="mark swipe">${disp(v[1])}</b>${sayBtn(vAudio(v, 1), v[1])}</div>
        <div><span>Past Participle (3. Form)</span><b class="mark swipe" style="animation-delay:.15s">${disp(v[2])}</b>${sayBtn(vAudio(v, 2), v[2])}</div></div>
        ${q.tip ? `<p class="muted" style="margin:12px 0 0">${q.tip}</p>` : ""}`;
      if (store.sound) play(q.audio, q.sayText);
      document.getElementById("fb").innerHTML = `<div class="row" style="margin-top:24px">
        <button class="btn ghost" id="no">Nochmal üben</button><button class="btn" id="yes">Wusste ich!</button></div>`;
      document.getElementById("yes").onclick = () => { record(true); next(); };
      document.getElementById("no").onclick = () => { record(false); next(); };
    };
  }
  window.scrollTo(0, 0);
}

function record(ok) {
  const q = S.qs[S.i];
  // Falsche Antworten kommen am Ende der Runde noch einmal dran; gewertet wird nur der erste Versuch
  if (!q.retry) {
    if (ok) S.right++; else { S.wrong.push(q.solution); S.qs.push({ ...q, retry: true }); }
  }
  if (q.verb && !(q.retry && ok)) {
    const name = q.verb[0];
    store.p[name] = ok ? streak(q.verb) + 1 : 0;
    store.m[name] = Math.max(0, (store.m[name] || 0) + (ok ? -1 : 1));
    save();
  }
}

function grade(ok) {
  const q = S.qs[S.i];
  record(ok);
  if (store.sound) play(q.audio, q.sayText);
  const praise = ["Richtig!", "Super!", "Genau!", "Perfekt!"];
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok ? "ok" : "bad"}"><span class="mark swipe ${ok ? "g" : "p"}">${ok ? praise[Math.floor(Math.random() * praise.length)] : "Noch nicht ganz."}</span>
      <small>${q.solution} ${sayBtn(q.audio, q.sayText)}${!ok && q.tip ? `<span class="tip">${q.tip}</span>` : ""}</small></div>
    <button class="btn" id="next">${S.i + 1 < S.qs.length ? "Weiter" : "Ergebnis ansehen"}</button>`;
  const n = document.getElementById("next");
  n.onclick = next; n.focus();
}

function next() {
  S.i++;
  if (S.i < S.qs.length) showQ(); else result();
}

function result() {
  const total = S.total || S.qs.length, r = S.right;
  store.session = null; save();
  const msg = r === total ? "Alles richtig – stark!" : r >= total * 0.7 ? "Richtig gut!" : r >= total * 0.4 ? "Schon ganz ordentlich – weiter so!" : "Übung macht den Meister – gleich nochmal!";
  app.innerHTML = `
    <p class="score"><b class="mark swipe ${r >= total * 0.7 ? "g" : ""}">${r}&thinsp;/&thinsp;${total}</b></p>
    <p class="center">${msg}</p>
    ${S.wrong.length ? `<div class="miss-box"><h2>Das schaust du dir nochmal an</h2><ul class="miss">${S.wrong.map(w => `<li>${w}</li>`).join("")}</ul></div>` : ""}
    <div class="row"><button class="btn ghost" id="home">Zur Übersicht</button><button class="btn" id="again">Nochmal</button></div>`;
  document.getElementById("again").onclick = () => start(S.mode);
  document.getElementById("home").onclick = home;
  window.scrollTo(0, 0);
}

if (store.session && store.session.qs && store.session.i < store.session.qs.length) { S = store.session; showQ(); }
else home();
</script>
</body>
</html>
